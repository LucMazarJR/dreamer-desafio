<header class="bg-white border-b border-border px-6 py-3 flex items-center justify-between shrink-0">
  <div class="flex items-center gap-3">
    <span class="text-sm font-bold text-primary">D&amp;DG</span>
    <span class="h-4 w-px bg-border"></span>
    <span class="text-xs text-muted tracking-widest uppercase">Workspace</span>
  </div>
  <div class="flex items-center gap-4">
    <div class="text-right">
      <p class="text-[10px] text-muted uppercase tracking-widest">Fuso Horário</p>
      <p class="text-xs font-medium text-foreground">Brasília (GMT-3)</p>
    </div>
    <button class="flex items-center gap-1.5 bg-primary text-primary-foreground text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-primary-800 transition-colors cursor-pointer">
      <svg lucideLogOut [size]="13"></svg>
      Sair
    </button>
  </div>
</header>
